[project]
name = "futbol-analytics"
version = "0.1.0"
description = "Análisis de rendimiento de jugadores con StatsBomb open data: métricas per-90, percentiles, similitud y visualizaciones"
requires-python = ">=3.10"
dependencies = [
    "statsbombpy>=1.14",
    "mplsoccer>=1.4",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.11",
    "streamlit>=1.46",
    "altair>=5",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "pre-commit"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Conjunto explícito: una subida de ruff no cambia las reglas en silencio.
# E4/E7/E9/F = los defaults clásicos; I = orden de imports; UP = modernizaciones.
select = ["E4", "E7", "E9", "F", "I", "UP"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
